# Quick end-to-end check of the pipeline on a 30,000-row subsample of the NYC data; runs in minutes.
# Not intended for reporting. Settings not given here take the package defaults, so the inner validation split,
# the sampler seeds and the combiner selection follow configs/ssd.yaml rather than configs/nyc.yaml.
run:
  name: nyc_smoke
  n_jobs: 2

dataset:
  adapter: nyc_taxi
  path: data/raw/nyc/train.csv
  sample_rows: 30000

split:
  n_folds: 3

tuning:
  max_rows: 8000
  early_stopping_rounds: 20
  max_estimators: 400
  n_trials: {LGBM: 3, XGB: 3, CAT: 2, RF: 2, DT: 2, RIDGE: 2}

base_learners: [LGBM, XGB, CAT, RF, DT, OLS, RIDGE]   # deep learners and EBM are omitted to keep the run short

stacking:
  meta_trials: 3

statistics:
  bootstrap_resamples: 200

robustness:
  seeds: [0, 1]

rolling:
  n_origins: 2

explain:
  tree_shap_rows: 500
  pipeline_shap_rows: 20
  pipeline_permutations: 1
  background_rows: 20

sensitivity:
  enabled: true
  params: [learning_rate]

profiling:
  latency_rows: 100
  warmup: 10
  workers: [1, 2]
  process_workers: [1, 2]
  batch_rows: 5000
